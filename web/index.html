<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG in Production</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">RAG in Production
      <a class="release" id="release" target="_blank" rel="noopener" hidden></a>
    </span>
    <span class="user" id="user-box" hidden>
      <span id="user-email"></span>
      <button type="button" class="link" id="sign-out">Sign out</button>
    </span>
  </header>

  <main>
    <!-- Step 1: email -->
    <section class="card" id="view-email" hidden>
      <h1>Sign in</h1>
      <p class="muted">Use your university email. We'll send you a one-time code, no password needed.</p>
      <form id="email-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
        <p class="hint" id="domain-hint"></p>
        <p class="error" id="email-error" role="alert"></p>
        <button type="submit" id="email-submit">Send code</button>
      </form>
    </section>

    <!-- Step 2: code -->
    <section class="card" id="view-code" hidden>
      <h1>Check your email</h1>
      <p class="muted">We sent a code to <strong id="code-email"></strong>. It can take a minute, and may land in spam.</p>
      <form id="code-form" novalidate>
        <label for="code">Code</label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" maxlength="8" required>
        <p class="error" id="code-error" role="alert"></p>
        <button type="submit" id="code-submit">Continue</button>
      </form>
      <div class="row">
        <button type="button" class="link" id="resend">Send a new code</button>
        <button type="button" class="link" id="change-email">Use another email</button>
      </div>
    </section>

    <!-- Step 3: chat -->
    <section class="chat" id="view-chat" hidden>
      <ol class="messages" id="messages" aria-live="polite"></ol>
      <form class="composer" id="chat-form" novalidate>
        <label for="message" class="visually-hidden">Message</label>
        <textarea id="message" rows="2" maxlength="4000" placeholder="Ask about the course documents" required></textarea>
        <button type="submit" id="send">Send</button>
      </form>
      <p class="error" id="chat-error" role="alert"></p>
    </section>

    <p class="error" id="config-error" role="alert" hidden>The page is missing its configuration (config.js).</p>
  </main>
</body>
</html>
