# Main customization point: paths, models, chunking, retrieval, and generation.

[paths]
documents = "data/documents"
index = "data/index"
prompt = "prompts/answer.txt"

[models]
provider = "ollama"
llm = "llama3.2:3b"
embedding = "sentence-transformers/all-MiniLM-L6-v2"
ollama_url = "http://localhost:11434"

[retrieval]
chunk_size = 900
chunk_overlap = 150
top_k = 5

[generation]
temperature = 0.2
max_tokens = 700

[files]
extensions = [".txt", ".md", ".pdf", ".docx"]