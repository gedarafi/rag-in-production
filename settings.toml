# Main customization point: paths, models, chunking, retrieval, and generation.

[paths]
documents = "data/documents/custom"
index = "data/index/custom"
prompt = "prompts/answer.txt"

[knowledge_base]
default = "anilist"

[models]
provider = "ollama" # ollama (local) or bedrock (bedrock-mantle, see [bedrock]); RAG_PROVIDER overrides it
llm = "llama3.2:3b"
embedding = "sentence-transformers/all-MiniLM-L6-v2"
embedding_device = "auto" # auto prefers CUDA, then MPS, then CPU
embedding_batch_size = 64 # Lower if GPU memory is insufficient
embedding_cache = true # Reuse unchanged chunks and resume interrupted embedding
embedding_cache_version = "1" # Change to force fresh embeddings for the same model
ollama_url = "http://127.0.0.1:11434"

[bedrock]
# Used when provider = "bedrock": OpenAI-compatible Chat Completions on bedrock-mantle. The pipeline
# needs schema-valid JSON, and qwen3-32b follows strict JSON schemas there.
# RAG_BEDROCK_REGION (or AWS_REGION) and RAG_BEDROCK_MODEL override these.
region = "us-east-2"
model_id = "qwen.qwen3-32b"

[retrieval]
chunk_size = 900
chunk_overlap = 150
top_k = 5
detail_top_k = 6 # Maximum passages for questions needing explanation
context_chars = 14000 # Total retrieved context budget
router_top_k = 6 # Semantically retrieved tool descriptions for the routing model
agent_max_steps = 8 # Maximum local functions in the single plan; chat uses two LLM calls

[generation]
context_window = 8192 # Preserve routing instructions, tool evidence and recent conversation
temperature = 0.2
max_tokens = 700

[files]
extensions = [".txt", ".md", ".pdf", ".docx"]

[tracing]
# Phoenix OTLP endpoint, e.g. "http://localhost:6006/v1/traces" (start it with `just phoenix-up`).
# Empty turns tracing off.
endpoint = ""
project = "rag-in-production"
