[project]
name = "rag-in-production"
version = "0.1.0"
description = "A configurable RAG application for local models"
readme = "README.md"
authors = [
    { name = "gedarafi", email = "goerman.rafi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arize-phoenix-otel>=0.17.2",
    "gradio>=5.0",
    "numpy>=1.26",
    "openinference-instrumentation>=0.1.71",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "requests>=2.32",
    "sentence-transformers>=3.0",
    "typer>=0.27",
]

[project.scripts]
rag = "src.cli:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""
