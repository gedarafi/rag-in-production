[project]
name = "rag-in-production"
version = "0.1.0"
description = "A configurable RAG application for local models"
readme = "README.md"
authors = [
    { name = "gedarafi", email = "goerman.rafi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arize-phoenix-otel>=0.17.2",
    "gradio>=5.0",
    "numpy>=1.26",
    "openinference-instrumentation>=0.1.71",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "requests>=2.32",
    "sentence-transformers>=3.0",
    "typer>=0.27",
    # The anime recommender's CLI (src/recommender); its worker image installs the recommender group.
    "boto3>=1.40",
    "jsonschema>=4.26",
    "onnxruntime>=1.23",
    "tokenizers>=0.22",
]

[project.scripts]
rag = "src.local.cli:main"
recommender = "src.recommender.cli:main"

[project.optional-dependencies]
evaluation = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "pandas>=3.0.6",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[dependency-groups]
# Bundled into the chat Lambda's zip by infra/scripts/build_chat_lambda.sh (boto3 comes with the runtime).
chat = [
    "openinference-instrumentation==0.1.71",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
]
# Installed into the recommender worker's container image (infra/docker/recommender.Dockerfile).
recommender = [
    "boto3>=1.40",
    "jsonschema>=4.26",
    "numpy>=1.26",
    "onnxruntime>=1.23",
    "openinference-instrumentation==0.1.71",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "requests>=2.32",
    "tokenizers>=0.22",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "typer>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests", "infra/scripts"]
pythonpath = [".", "infra/scripts"]
addopts = ["-m", "not phoenix and not localstack", "--strict-markers"]
markers = ["phoenix: needs a running Phoenix (`just phoenix-up`); run with `just test-phoenix`",
           "localstack: needs the local stack (`just up`, `just apply`); run with `just test-vector-db`"]

[tool.coverage.run]
source = ["src", "infra/scripts"]
omit = ["infra/scripts/test_*.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
