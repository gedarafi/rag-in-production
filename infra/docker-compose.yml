# Local AWS emulator (`just up`) and Phoenix, which traces the local RAG (`just phoenix-up`).
# See the justfile for the other recipes.
name: rag-in-production

services:
  localstack:
    image: localstack/localstack:2026.10
    container_name: localstack
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external service ports
    environment:
      # Free token from https://app.localstack.cloud → Auth Tokens; put it in .env.
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?set LOCALSTACK_AUTH_TOKEN in .env (see .env.example)}
      - DEBUG=${LOCALSTACK_DEBUG:-0}
      - PERSISTENCE=${LOCALSTACK_PERSISTENCE:-0}
      # LocalStack's Bedrock runs this Ollama model when the recommender uses it
      # (RAG_LOCAL_MODEL_API=converse; by default it calls the ollama service below instead).
      # LOCALSTACK_BEDROCK_PREWARM=1 pulls and loads it at startup instead of on the first question.
      - DEFAULT_BEDROCK_MODEL=${LOCALSTACK_BEDROCK_MODEL:-llama3.2:3b}
      - BEDROCK_PREWARM=${LOCALSTACK_BEDROCK_PREWARM:-0}
      # Docker flags for LocalStack's Ollama container (it accepts only some, e.g. -e, -v, -m; no --gpus).
      # `just up` asks for the GPU with -e NVIDIA_VISIBLE_DEVICES=all when nvidia is Docker's default
      # runtime (`just gpu-setup`); empty runs it on CPU.
      - BEDROCK_DOCKER_FLAGS=${LOCALSTACK_BEDROCK_DOCKER_FLAGS:-}
      # Lambda containers join this Compose network, so the chat Lambda can send traces to phoenix.
      - LAMBDA_DOCKER_NETWORK=rag-in-production_default
    volumes:
      - "./.localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"  # needed for Lambda
    healthcheck:
      # The image ships Python but not curl.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  phoenix:
    # Traces of the local RAG in src/local/ (set [tracing] endpoint in settings.toml); UI on :6006.
    image: arizephoenix/phoenix:version-20.23.0
    container_name: phoenix
    ports:
      - "127.0.0.1:6006:6006"  # UI and OTLP/HTTP at /v1/traces
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - "./.phoenix:/mnt/data"  # traces survive restarts; delete the folder to clear them
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama:
    # The recommender's local model (`just up`; live/local/env.hcl, MODEL_API=ollama): the worker Lambda
    # reaches it as http://ollama:11434 on this network and asks for schema-constrained output, which
    # LocalStack's Bedrock emulation can't pass on. docker-compose.gpu.yml gives it the NVIDIA GPU.
    image: ollama/ollama:0.40.5
    container_name: ollama
    ports:
      - "127.0.0.1:11435:11434"  # 11434 is often taken by an Ollama on the host
    environment:
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      - "./.ollama:/root/.ollama"  # pulled models survive restarts
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
