name: Infra

on:
  pull_request:
    paths:
      - "infra/**"
      - "src/chat/**"
      - "src/auth/**"
      - "tests/**"
      - "justfile"
      - ".github/workflows/infra.yml"
      - ".github/actions/setup-infra/**"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "src/chat/**"
      - "src/auth/**"
      - "tests/**"
      - "justfile"
      - ".github/workflows/infra.yml"
      - ".github/actions/setup-infra/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The workflow also runs for justfile, tooling and diagram-script changes; the LocalStack job
  # only needs to run when the infrastructure it deploys, or the way it is deployed, changes.
  changes:
    name: Detect infra changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - "infra/modules/**"
              - "infra/live/**"
              - "src/chat/**"
              - "src/auth/**"
              - "infra/docker-compose.yml"
              - "infra/.opentofu-version"
              - "infra/.terragrunt-version"
              - "infra/.just-version"
              - ".github/actions/setup-infra/**"
              - "infra/scripts/local_flow.py"
              - ".github/workflows/infra.yml"

  static:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    outputs:
      has_localstack_token: ${{ steps.token.outputs.present }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-infra

      - run: just lint
      - run: just test-unit

      # Secrets are not available to pull requests from forks; the LocalStack job is skipped then.
      - name: Check for LocalStack token
        id: token
        env:
          TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: echo "present=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  localstack:
    name: LocalStack integration and e2e
    needs: [changes, static]
    if: >-
      needs.static.outputs.has_localstack_token == 'true' &&
      (needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-infra

      - name: Configure LocalStack token
        env:
          TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: echo "LOCALSTACK_AUTH_TOKEN=$TOKEN" > infra/.env

      - run: just up
      - run: just status
      - run: just test-localstack
      - run: just e2e

      - name: LocalStack logs
        if: failure()
        run: just logs --tail=all

      - name: Stop LocalStack
        if: always()
        run: just down
